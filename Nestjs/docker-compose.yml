services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-college}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-college}
      POSTGRES_DB: ${POSTGRES_DB:-college_os}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-college} -d ${POSTGRES_DB:-college_os}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: [.env]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # inside the compose network the hostnames are the service names
      DATABASE_URL: postgresql://${POSTGRES_USER:-college}:${POSTGRES_PASSWORD:-college}@postgres:5432/${POSTGRES_DB:-college_os}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_PATH: /data/uploads
      ALLOW_DB_PUSH: "true"  # dev convenience; remove once prisma/migrations is committed
    ports: ["${PORT:-3000}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [uploads:/data/uploads]
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  pgdata:
  redisdata:
  uploads:
